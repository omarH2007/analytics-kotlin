jdk:
  - openjdk11

before_install:
  - chmod +x gradlew

install:
  # Build and publish core module first (android depends on it)
  - ./gradlew :core:build :core:publishToMavenLocal -Prelease -x test
  # Build and publish android module
  - ./gradlew :android:build :android:publishToMavenLocal -Prelease -x test
