apply plugin: 'maven-publish'
apply plugin: 'signing'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId GROUP
                artifactId POM_ARTIFACT_ID
                version rootProject.getVersionName()

                // For Android libraries, manually attach the AAR to preserve our groupId
                // Using components.release would override our groupId with AGP's internal coordinates
                if (project.plugins.hasPlugin('com.android.library')) {
                    artifact("$buildDir/outputs/aar/${project.name}-release.aar")

                    // Manually add dependencies from the android module
                    pom.withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')

                        // Add compile dependencies
                        configurations.api.allDependencies.each { dep ->
                            if (dep.group != null && dep.name != null) {
                                def depNode = dependenciesNode.appendNode('dependency')
                                // Handle project dependencies
                                if (dep instanceof ProjectDependency) {
                                    depNode.appendNode('groupId', GROUP)
                                    depNode.appendNode('artifactId', dep.name)
                                    depNode.appendNode('version', rootProject.getVersionName())
                                } else {
                                    depNode.appendNode('groupId', dep.group)
                                    depNode.appendNode('artifactId', dep.name)
                                    depNode.appendNode('version', dep.version ?: '')
                                }
                                depNode.appendNode('scope', 'compile')
                            }
                        }

                        // Add implementation dependencies as runtime
                        configurations.implementation.allDependencies.each { dep ->
                            if (dep.group != null && dep.name != null && !(dep instanceof ProjectDependency)) {
                                def depNode = dependenciesNode.appendNode('dependency')
                                depNode.appendNode('groupId', dep.group)
                                depNode.appendNode('artifactId', dep.name)
                                depNode.appendNode('version', dep.version ?: '')
                                depNode.appendNode('scope', 'runtime')
                            }
                        }
                    }
                } else {
                    // For JVM/Kotlin libraries, use the java component
                    from components.java

                    // Fix dependencies for core module
                    pom.withXml {
                        def dependenciesNode = asNode().getAt('dependencies')[0]
                        if (dependenciesNode != null) {
                            dependenciesNode.children().each { dep ->
                                def depGroupIdNode = dep.getAt('groupId')[0]
                                def artifactIdNode = dep.getAt('artifactId')[0]
                                if (depGroupIdNode != null && artifactIdNode != null) {
                                    def artifactId = artifactIdNode.text()
                                    if (artifactId == 'core' || artifactId == 'android') {
                                        depGroupIdNode.setValue(GROUP)
                                        def versionNode = dep.getAt('version')[0]
                                        if (versionNode != null) {
                                            versionNode.setValue(rootProject.getVersionName())
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

                // Add sources and javadoc
                artifact sourcesJar
                artifact javadocJar

                pom {
                    name = POM_NAME
                    packaging = POM_PACKAGING
                    description = POM_DESCRIPTION
                    url = POM_URL

                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                            distribution = POM_LICENCE_DIST
                        }
                    }

                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                        }
                    }

                    scm {
                        url = POM_SCM_URL
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                    }
                }
            }
        }
    }
}

// Only sign when credentials are available (not on JitPack)
signing {
    required { gradle.taskGraph.hasTask("publishToSonatype") }
    sign publishing.publications
}

publish.dependsOn build
publishToMavenLocal.dependsOn build

// For Android modules, ensure assembleRelease runs before publishing
if (project.plugins.hasPlugin('com.android.library')) {
    tasks.matching { it.name == 'publishReleasePublicationToMavenLocal' }.configureEach {
        dependsOn 'assembleRelease'
    }
    tasks.matching { it.name == 'publishReleasePublicationToMavenRepository' }.configureEach {
        dependsOn 'assembleRelease'
    }
}

// Only configure Sonatype publishing if the task exists (not on JitPack)
tasks.matching { it.name == 'publishToSonatype' }.configureEach {
    dependsOn publish
}
